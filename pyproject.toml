[project]
name = "supermemo-toolkit"
dynamic = ["version"]
description = "SuperMemo 增强工具(CLI命令行)。包含图链整理、EPUB图书转换导入、Latex公式转图片、sm2anki、修补导出标题乱码、卡片朗读等。"
readme = "README.md"
keywords = ["supermemo", "cli-app", "toolkit"]
classifiers = [
    "Topic :: Utilities",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
]
authors = [{ name = "tingshu", email = "xinglan42w@outlook.com" }]
license = { text = "GPL-2.0-only" }
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "charset-normalizer>=3.5.2",
    "click>=8.5.0",
    "ebooklib>=0.21",
    "edge-tts>=7.3.1",
    "matplotlib>=3.11.2",
    "miniaudio>=1.71",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "prompt-toolkit>=3.0.53",
    "pymem>=1.14.0",
    "pyperclip>=1.11.0",
    "pypinyin>=0.55.0",
    "pystray>=0.19.5",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "pywinauto>=0.6.9; sys_platform == 'win32'",
    "regex>=2026.9.29",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "svglib>=2.4.0",
    "tqdm>=4.70.1",
    "watchdog>=7.1.0",
    "yattag>=1.16.1",
]

# setx PYTHONUTF8 1
# uvx uv-upsync
# uvx uv-bump

[dependency-groups]
dev = ["pyinstaller>=6.22.3"]

[project.urls]
homepage = "https://github.com/Zacharia2/SuperMemo-Toolkit"
repository = "https://github.com/Zacharia2/SuperMemo-Toolkit"
documentation = "https://github.com/Zacharia2/SuperMemo-Toolkit"

[project.scripts]
# inno有图形界面和快捷方式，whl仅仅只有命令
smtk = "supermemo_toolkit.smtk:main"

[tool.pdm.build]
excludes = ["docs/**"]

[tool.pdm.version]
source = "file"
path = "supermemo_toolkit/__init__.py"

[[tool.pdm.source]]
name = "tuna"
url = "https://repo.huaweicloud.com/repository/pypi/simple/"
verify_ssl = true

[[tool.uv.index]]
name = "tuna"
url = "https://repo.huaweicloud.com/repository/pypi/simple/"
default = true

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
