name: Build Windows Installer

on:
    release:
        types: [published]
    push:
        tags:
            - "v*" # push tag 也触发；如果只想要 release 触发，删掉这段
    workflow_dispatch: # 允许手动重跑

jobs:
    build:
        runs-on: windows-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7.0.1

            - name: astral-sh/setup-uv
              uses: astral-sh/setup-uv@v10.0.1
              with:
                  version: "latest"

            - name: Install Python and dependencies
              run: |
                  uv python install 3.10
                  uv sync --frozen

            - name: Build Wheel
              run: uv build --wheel

            - name: Build Executable
              run: uv run pyinstaller --noconfirm smtk.spec

            # ② 校验 onedir 产物
            - name: Verify PyInstaller output
              shell: pwsh
              run: |
                  $required = @(
                    'dist/smtk/smtk.exe',
                    'dist/smtk/smtk-shell.exe',
                    'dist/smtk/launcher.exe'
                  )
                  foreach ($f in $required) {
                    if (-not (Test-Path $f)) { throw "Missing: $f" }
                  }

            # ③ 安装 Inno Setup 并编译安装包
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y

            - name: Compile installer
              shell: pwsh
              run: |
                  $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
                  & $iscc smtk.iss
                  if ($LASTEXITCODE -ne 0) {
                    throw "ISCC failed: $LASTEXITCODE"
                  }

            # ④ 上传安装包 + wheel
            - name: Upload to Release
              uses: softprops/action-gh-release@v3.0.2
              with:
                  files: |
                      dist/*.exe
                      dist/*.whl
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
